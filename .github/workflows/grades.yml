name: DIAS grade watcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: grade-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: grades-state-${{ github.run_id }}
          restore-keys: grades-state-

      - name: Check grades
        env:
          DIAS_USER: ${{ secrets.DIAS_USER }}
          DIAS_PASS: ${{ secrets.DIAS_PASS }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GRADES_URL: ${{ secrets.GRADES_URL }}
        run: python grade_watcher.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: grades-state-${{ github.run_id }}
